[project]
name = "arm-policy"
version = "0.1.0"
description = "Safely execute contract-validated arm policies through Viam resources"
readme = "README.md"
authors = [
    { name = "Abe Winter", email = "abe-winter@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "msgpack>=1.0.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "pydantic>=2.13.5",
    "toppra>=0.6.3,<0.7",
    "typing-extensions>=4.8.0",
    # switch to >= 0.81.0 when it lands. we need motion streaming
    "viam-sdk>=0.83.0",
    "websockets>=12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
