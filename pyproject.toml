[project]
name = "arm-policy"
version = "0.1.0"
description = "Safely execute contract-validated arm policies through Viam resources"
readme = "README.md"
authors = [
    { name = "Abe Winter", email = "abe-winter@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "msgpack>=1.0.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "pydantic>=2.13.5",
    # 0.6.9+ only ships Linux x86_64 wheels and no sdist; 0.6.3 builds from source elsewhere.
    "toppra>=0.6.10,<0.7; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "toppra==0.6.3; sys_platform != 'linux' or platform_machine != 'x86_64'",
    "typing-extensions>=4.8.0",
    "viam-sdk>=0.83.0",
    "websockets>=12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
arm-policy-workflow = "tools.policy_workflow:main"
